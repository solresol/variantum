name: Build paper

on:
  push:
    paths:
      - .github/workflows/build-paper.yml
      - Makefile
      - scripts/build_arxiv_paper.py
      - scripts/generate_paper_appendices.py
      - outputs/arxiv/main.tex
      - outputs/arxiv/COAUTHOR_CIRCULATION.md
      - analysis/greta-chinese-ground-truth-metrics.csv
      - analysis/review-ratings-release.json
      - analysis/reviewer-metric-signal.csv
      - analysis/review-timing-distribution-and-length.png
      - analysis/greta-chinese-prediction-scatter.png
      - analysis/vanessa-set1-length-and-composite-scatter.png
      - outputs/ai4as-2026-parallage/pptx_render/slide-3.png
  pull_request:
    paths:
      - .github/workflows/build-paper.yml
      - Makefile
      - scripts/build_arxiv_paper.py
      - scripts/generate_paper_appendices.py
      - outputs/arxiv/main.tex
      - outputs/arxiv/COAUTHOR_CIRCULATION.md
      - analysis/greta-chinese-ground-truth-metrics.csv
      - analysis/review-ratings-release.json
      - analysis/reviewer-metric-signal.csv
      - analysis/review-timing-distribution-and-length.png
      - analysis/greta-chinese-prediction-scatter.png
      - analysis/vanessa-set1-length-and-composite-scatter.png
      - outputs/ai4as-2026-parallage/pptx_render/slide-3.png
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Build and validate PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install XeLaTeX, fonts, PDF tools, and ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-liberation2 \
            fonts-noto-cjk \
            lmodern \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex \
            unzip \
            zip

      - name: Build and validate all paper artifacts
        run: make --always-make

      - name: Upload paper PDF
        uses: actions/upload-artifact@v6
        with:
          name: parallage-preprint
          path: outputs/arxiv/into-the-parallage-arxiv.pdf
          if-no-files-found: error
          retention-days: 30
